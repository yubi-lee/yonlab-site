<svg viewBox="0 0 1200 380" width="1200" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title>위치기반 관제 서비스 6단계 처리 흐름</title>

  <rect x="0" y="0" width="1200" height="380" fill="#FFFFFF"/>

  <!-- phase bands -->
  <rect x="2"   y="56" width="396" height="286" rx="20" fill="#F3F7FF"/>
  <rect x="404" y="56" width="392" height="286" rx="20" fill="#F1F5FF"/>
  <rect x="804" y="56" width="394" height="286" rx="20" fill="#F3F7FF"/>

  <!-- phase labels -->
  <text x="200"  y="42" text-anchor="middle" font-size="18" font-weight="800" fill="#1D4ED8">입력<tspan font-size="14" font-weight="500" fill="#64748B">   ·  사용자 인증 · 요청</tspan></text>
  <text x="600"  y="42" text-anchor="middle" font-size="18" font-weight="800" fill="#1D4ED8">처리<tspan font-size="14" font-weight="500" fill="#64748B">   ·  위치 산출 · 보안</tspan></text>
  <text x="1000" y="42" text-anchor="middle" font-size="18" font-weight="800" fill="#1D4ED8">출력<tspan font-size="14" font-weight="500" fill="#64748B">   ·  확인 · 표시</tspan></text>

  <!-- cards -->
  <rect x="12"   y="100" width="176" height="200" rx="16" fill="#FFFFFF" stroke="#DBE4F3" stroke-width="1.5"/>
  <rect x="212"  y="100" width="176" height="200" rx="16" fill="#FFFFFF" stroke="#DBE4F3" stroke-width="1.5"/>
  <rect x="412"  y="100" width="176" height="200" rx="16" fill="#FFFFFF" stroke="#DBE4F3" stroke-width="1.5"/>
  <rect x="612"  y="100" width="176" height="200" rx="16" fill="#FFFFFF" stroke="#DBE4F3" stroke-width="1.5"/>
  <rect x="812"  y="100" width="176" height="200" rx="16" fill="#FFFFFF" stroke="#DBE4F3" stroke-width="1.5"/>
  <rect x="1012" y="100" width="176" height="200" rx="16" fill="#FFFFFF" stroke="#DBE4F3" stroke-width="1.5"/>

  <!-- centered arrows between cards -->
  <g fill="none" stroke="#2563EB" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="195,188 206,200 195,212"/>
    <polyline points="395,188 406,200 395,212"/>
    <polyline points="595,188 606,200 595,212"/>
    <polyline points="795,188 806,200 795,212"/>
    <polyline points="995,188 1006,200 995,212"/>
  </g>

  <!-- icons -->
  <g fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(83,126)">
      <path d="M17 2 L30 7 V17 C30 26 23 31 17 33 C11 31 4 26 4 17 V7 Z"/>
      <path d="M11 17 l4.5 4.5 l7.5 -9"/>
    </g>
    <g transform="translate(283,126)">
      <path d="M17 3 C10 3 6 8 6 14 C6 22 17 33 17 33 C17 33 28 22 28 14 C28 8 24 3 17 3 Z"/>
      <circle cx="17" cy="14" r="3.6"/>
    </g>
    <g transform="translate(483,126)">
      <circle cx="17" cy="17" r="9"/>
      <path d="M17 2 V10 M17 24 V32 M2 17 H10 M24 17 H32"/>
      <circle cx="17" cy="17" r="1.8" fill="#2563EB" stroke="none"/>
    </g>
    <g transform="translate(683,126)">
      <rect x="6" y="16" width="22" height="15" rx="3"/>
      <path d="M11 16 V11 a6 6 0 0 1 12 0 V16"/>
      <path d="M17 22 V25.5"/>
    </g>
    <g transform="translate(883,126)">
      <circle cx="14" cy="12" r="5.5"/>
      <path d="M5 30 C5 22 23 22 23 30"/>
      <circle cx="26" cy="26" r="6.5" fill="#FFFFFF"/>
      <path d="M23 26 l2.2 2.2 l3.8 -4"/>
    </g>
    <g transform="translate(1083,126)">
      <path d="M17 6 a6.5 6.5 0 0 1 6.5 6.5 c0 7 3.2 8.5 3.2 8.5 H7.3 s3.2 -1.5 3.2 -8.5 a6.5 6.5 0 0 1 6.5 -6.5 Z"/>
      <path d="M14 25 a3 3 0 0 0 6 0"/>
      <circle cx="17" cy="4.5" r="1.6" fill="#2563EB" stroke="none"/>
    </g>
  </g>

  <!-- number badges -->
  <g>
    <circle cx="100"  cy="100" r="17" fill="#2563EB"/>
    <circle cx="300"  cy="100" r="17" fill="#2563EB"/>
    <circle cx="500"  cy="100" r="17" fill="#2563EB"/>
    <circle cx="700"  cy="100" r="17" fill="#2563EB"/>
    <circle cx="900"  cy="100" r="17" fill="#2563EB"/>
    <circle cx="1100" cy="100" r="17" fill="#2563EB"/>
  </g>
  <g text-anchor="middle" font-weight="800" font-size="17" fill="#FFFFFF">
    <text x="100"  y="106">1</text>
    <text x="300"  y="106">2</text>
    <text x="500"  y="106">3</text>
    <text x="700"  y="106">4</text>
    <text x="900"  y="106">5</text>
    <text x="1100" y="106">6</text>
  </g>

  <!-- titles -->
  <g text-anchor="middle" font-size="20" font-weight="800" fill="#0F172A">
    <text x="100"  y="212">보호자 인증</text>
    <text x="300"  y="212">위치 요청</text>
    <text x="500"  y="212">위치 산출</text>
    <text x="700"  y="212">암호화 전송</text>
    <text x="900"  y="212">권한 확인</text>
    <text x="1100" y="212">표시·알림</text>
  </g>

  <!-- descriptions -->
  <g text-anchor="middle" font-size="14" fill="#5B677A">
    <text x="100"  y="240">계정 로그인</text><text x="100"  y="263">단말 ID·IMEI 연결</text>
    <text x="300"  y="240">부모앱이 서버에</text><text x="300"  y="263">위치 조회 요청</text>
    <text x="500"  y="240">키즈워치 GPS 우선</text><text x="500"  y="263">Wi-Fi·기지국 보완</text>
    <text x="700"  y="240">HTTPS로 위치·</text><text x="700"  y="263">정확도·시각 전송</text>
    <text x="900"  y="240">세션·보호자–단말</text><text x="900"  y="263">관계 확인</text>
    <text x="1100" y="240">부모앱 지도·이력</text><text x="1100" y="263">안전구역·SOS 알림</text>
  </g>
</svg>
